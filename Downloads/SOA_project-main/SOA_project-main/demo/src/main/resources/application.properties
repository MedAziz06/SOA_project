# Server Configuration
server.port=8081
spring.application.name=demo

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/meslivre_users?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=VotreCleSecreteTresLongueEtComplexePourJWT2024MesLivres
jwt.expiration=86400000
# 86400000 ms = 24 heures

# CORS Configuration
cors.allowed.origins=http://localhost:4200

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.meslivres=DEBUG